'Hoerbiger.HoerbigerCom.PressArchive:Content.LatestPressReleases':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Headline': true
  ui:
    icon: 'newspaper'
    label: 'Latest Press Releases'
  properties:
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    headline:
      options:
        preset: 'rte.plain'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('h2', value)}
        elasticSearchMapping:
          type: text

'Hoerbiger.HoerbigerCom:Document.HomePage':
  childNodes:
    main:
      constraints:
        nodeTypes:
          'Hoerbiger.HoerbigerCom.PressArchive:Content.LatestPressReleases': true

'Hoerbiger.HoerbigerCom:Document.WebPage':
  childNodes:
    main:
      constraints:
        nodeTypes:
          'Hoerbiger.HoerbigerCom.PressArchive:Content.LatestPressReleases': true

'Hoerbiger.HoerbigerCom.Catalog:Document.IndustrySolutions':
  childNodes:
    main:
      constraints:
        nodeTypes:
          'Hoerbiger.HoerbigerCom.PressArchive:Content.LatestPressReleases': true

'Hoerbiger.HoerbigerCom.Catalog:Document.IndustrySolution':
  childNodes:
    main:
      constraints:
        nodeTypes:
          'Hoerbiger.HoerbigerCom.PressArchive:Content.LatestPressReleases': true

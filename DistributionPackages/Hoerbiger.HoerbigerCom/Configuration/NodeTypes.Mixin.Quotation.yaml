'Hoerbiger.HoerbigerCom:Mixin.Quotation':
  abstract: true
  properties:
    text:
      options:
        preset: 'rte.text'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter text'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    spokenByCharacter:
      options:
        preset: 'rte.plainWithRed'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter name'

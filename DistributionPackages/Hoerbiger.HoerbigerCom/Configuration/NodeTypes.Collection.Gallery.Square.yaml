'Hoerbiger.HoerbigerCom:Collection.Gallery.Square':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Neos.Neos:ContentCollection': true
  constraints:
    nodeTypes:
      '*': false
      'Hoerbiger.HoerbigerCom:Content.GalleryImage.Square': true
  ui:
    label: 'Image Gallery (1:1)'
    icon: images
  options:
    template:
      childNodes:
        'image1':
          type: 'Hoerbiger.HoerbigerCom:Content.GalleryImage.Square'
        'image2':
          type: 'Hoerbiger.HoerbigerCom:Content.GalleryImage.Square'
  properties:
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text

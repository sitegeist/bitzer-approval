'Hoerbiger.HoerbigerCom.ApplicationWorlds:Document.ApplicationWorld':
  superTypes:
    'Hoerbiger.HoerbigerCom:Document': true
    'Hoerbiger.HoerbigerCom:Mixin.Preview': true
    'Hoerbiger.HoerbigerCom:Mixin.SliderPreview': true
    'Hoerbiger.HoerbigerCom:Mixin.Introduction': true
    'Hoerbiger.Shared:Mixin.Searchable': true
  childNodes:
    sections:
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': false
          'Hoerbiger.HoerbigerCom.ApplicationWorlds:Content.Section': true
    main:
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': false
          'Hoerbiger.HoerbigerCom:Content.Text': true
          'Hoerbiger.HoerbigerCom:Content.ImageOverlappedByText': true
          'Hoerbiger.HoerbigerCom:Content.TileNavigation': true
    footer:
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': false
          'Hoerbiger.HoerbigerCom:Content.Text': true
          'Hoerbiger.HoerbigerCom:Content.ImageOverlappedByText': true
          'Hoerbiger.HoerbigerCom:Content.TileNavigation': true
  constraints:
    nodeTypes:
      '*': false
  ui:
    icon: compact-disc
    label: 'Application World'
    inspector:
      tabs:
        sliderPreview:
          icon: 'arrows-alt-h'
          position: 'after preview'
      groups:
        sliderPreview:
          label: 'Preview Slider Homepage'
          tab: 'sliderPreview'
  properties:
    image:
      validation: ~
    image__alt:
      validation: ~
    image__title:
      validation: ~
    searchType:
      search:
        indexing: '${"ApplicationWorld"}'


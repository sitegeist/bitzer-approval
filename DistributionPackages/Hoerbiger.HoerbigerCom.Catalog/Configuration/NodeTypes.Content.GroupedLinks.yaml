'Hoerbiger.HoerbigerCom.Catalog:Content.GroupedLinks':
  superTypes:
    'Neos.Neos:ContentCollection': true
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Image': true
  ui:
    icon: 'object-ungroup'
    label: 'Grouped Links'
    inspector:
      groups:
        links:
          label: 'Links'
          icon: 'link'
  constraints:
    nodeTypes:
      '*': false
      'Hoerbiger.HoerbigerCom.Catalog:Content.GroupedLinks.Item': true
  options:
    template:
      childNodes:
        link1:
          type: 'Hoerbiger.HoerbigerCom.Catalog:Content.GroupedLinks.Item'
        link2:
          type: 'Hoerbiger.HoerbigerCom.Catalog:Content.GroupedLinks.Item'
  properties:
    name:
      options:
        preset: 'rte.text'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter title'
      search:
        fulltextExtractor: ${Indexing.extractInto('h2', value)}
        elasticSearchMapping:
          type: text

'Hoerbiger.HoerbigerCom.Catalog:Content.GroupedLinks.Item':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Link': true
  ui:
    label: 'Link Item'
    icon: 'link'
  properties:
    link__target:
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': { }

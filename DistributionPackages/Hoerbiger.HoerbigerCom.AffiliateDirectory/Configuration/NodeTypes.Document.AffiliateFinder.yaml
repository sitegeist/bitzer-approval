'Hoerbiger.HoerbigerCom.AffiliateDirectory:Document.AffiliateFinder':
  superTypes:
    'Hoerbiger.HoerbigerCom:Document': true
    'Hoerbiger.HoerbigerCom:Mixin.Introduction.FullMedia': true
    'Hoerbiger.HoerbigerCom:Mixin.Text': true
    'Hoerbiger.Shared:Mixin.Searchable': true
  ui:
    icon: search-location
    label: 'Affiliate Finder'
  properties:
    searchType:
      search:
        indexing: '${"WebPage"}'
    applicationHeadline:
      options:
        preset: 'rte.plain'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('h2', value)}
        elasticSearchMapping:
          type: text




'Hoerbiger.HoerbigerCom:Document.HomePage':
  childNodes:
    affiliatefinder:
      type: 'Hoerbiger.HoerbigerCom.AffiliateDirectory:Document.AffiliateFinder'
      position: 448

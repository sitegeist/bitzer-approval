Sitegeist:
  MagicWand:
    flowCommand: './flow'

    # preset which is used by the clone:default command
    defaultPreset: 'develop'

    clonePresets:
      develop:
        host: hoerbiger
        user: uext_anf
        port: 22
        sshOptions: '-t '
        path: '/srv/dockerdata/www-dev/www/hoerbiger_deployer/current'
        context: Production
        flowCommand: 'cd /srv/dockerdata/www-dev && docker-compose exec -T php php /var/www/html/hoerbiger_deployer/current/flow'

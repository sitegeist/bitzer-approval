'Hoerbiger.HoerbigerCom:Content.TextWithImage':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Image': true
    'Hoerbiger.HoerbigerCom:Mixin.Text': true
    'Hoerbiger.HoerbigerCom:Mixin.Link': true
  ui:
    label: 'Text With Image'
    icon: id-card
    inspector:
      groups:
        text:
          label: 'Text'
          icon: 'align-left'
  properties:
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    layout:
      type: string
      defaultValue: 'imageFirst'
      ui:
        label: 'Layout'
        reloadIfChanged: true
        inspector:
          group: 'image'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
    column:
      type: string
      defaultValue: '50_50'
      ui:
        label: 'Spalten'
        reloadIfChanged: true
        inspector:
          group: 'image'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
    showMobileImageFirst:
      type: boolean
      defaultValue: false
      ui:
        label: 'Image first (on mobile)'
        reloadPageIfChanged: true
        inspector:
          group: 'image'
    text__block__image:
      type: 'Neos\Media\Domain\Model\ImageInterface'
      ui:
        label: 'Image inside Text'
        reloadIfChanged: true
        inspector:
          group: 'text'
    text__block__image__alt:
      type: 'string'
      ui:
        label: 'Alt Text'
        inspector:
          group: 'text'
    text__block__image__title:
      type: 'string'
      ui:
        label: 'Title-Text'
        inspector:
          group: 'text'

  postprocessors:
    layouts:
      postprocessor: PackageFactory\AtomicFusion\PresentationObjects\Application\EnumProvider
      postprocessorOptions:
        enumName: Hoerbiger\Shared\Presentation\EnumProvider\TextWithImage\Layout
        propertyNames:
          - layout
    columns:
      postprocessor: PackageFactory\AtomicFusion\PresentationObjects\Application\EnumProvider
      postprocessorOptions:
        enumName: Hoerbiger\Shared\Presentation\EnumProvider\TextWithImage\Columns
        propertyNames:
          - column

'Hoerbiger.HoerbigerCom:Mixin.SliderPreview':
  abstract: true
  properties:
    slider__preview__headline:
      type: 'string'
      ui:
        label: 'Slider: Headline'
        inspector:
          group: 'sliderPreview'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': { }
      options:
        translateOnAdoption: true
    slider__preview__description:
      type: 'string'
      ui:
        label: 'Slider: Description'
        inspector:
          group: 'sliderPreview'
          editor: 'Neos.Neos/Inspector/Editors/TextAreaEditor'
          editorOptions:
            rows: 7
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': { }
      options:
        translateOnAdoption: true
    video:
      type: 'Neos\Media\Domain\Model\Asset'
      ui:
        label: 'Preview Video'
        inspector:
          group: 'sliderPreview'
      constraints:
        mediaTypes: [ 'video/mp4' ]
    slider__preview__image:
      type: 'Neos\Media\Domain\Model\ImageInterface'
      options:
        preset: 'image.5_3'
      ui:
        label: 'Slider: Image'
        inspector:
          group: 'sliderPreview'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': { }
    slider__preview__image__alt:
      type: 'string'
      ui:
        label: 'Alt Text Image'
        inspector:
          group: 'sliderPreview'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': { }
      options:
        translateOnAdoption: true
    slider__preview__image__title:
      type: 'string'
      ui:
        label: 'Title-Text Image'
        inspector:
          group: 'sliderPreview'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': { }
    slider__preview__background:
      type: 'Neos\Media\Domain\Model\ImageInterface'
      options:
        preset: 'image.landscape'
      ui:
        label: 'Slider: Background Image'
        inspector:
          group: 'sliderPreview'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': { }
    slider__preview__background__alt:
      type: 'string'
      ui:
        label: 'Alt Text Background Image'
        inspector:
          group: 'sliderPreview'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': { }
      options:
        translateOnAdoption: true
    slider__preview__background__title:
      type: 'string'
      ui:
        label: 'Title-Text Backgrund Image'
        inspector:
          group: 'sliderPreview'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': { }
      options:
        translateOnAdoption: true

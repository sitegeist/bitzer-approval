'Hoerbiger.HoerbigerCom:Document.HomePage':
  superTypes:
    'Hoerbiger.HoerbigerCom:Document': true
    'Hoerbiger.HoerbigerCom:Mixin.Preview': true
    'Hoerbiger.HoerbigerCom:Mixin.Text': true
    'Hoerbiger.HoerbigerCom:Mixin.Headline': true
    'Hoerbiger.HoerbigerCom:Mixin.Image': true
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': false
          'Hoerbiger.HoerbigerCom:Collection.Downloads': true
          'Hoerbiger.HoerbigerCom:Collection.Gallery': true
          'Hoerbiger.HoerbigerCom:Collection.Gallery.Square': true
          'Hoerbiger.HoerbigerCom:Collection.Gallery.Portrait': true
          'Hoerbiger.HoerbigerCom:Collection.TabBox': true
          'Hoerbiger.HoerbigerCom:Content.Image': true
          'Hoerbiger.HoerbigerCom:Content.Quotation': true
          'Hoerbiger.HoerbigerCom:Content.Text': true
          'Hoerbiger.HoerbigerCom:Content.TextWithImage': true
          'Hoerbiger.HoerbigerCom:Content.ImageOverlappedByText': true
          'Hoerbiger.HoerbigerCom:Content.MostWanted': true
          'Hoerbiger.HoerbigerCom:Content.Video': true
          'Hoerbiger.HoerbigerCom:Content.TileNavigation': true
          'Hoerbiger.HoerbigerCom:Content.ImageWithLink': true
    careerroot:
      type: 'Hoerbiger.HoerbigerCom:Document.CareerRootPage'
      position: 128
    contact:
      type: 'Hoerbiger.HoerbigerCom:Document.ContactPage'
      position: 256
    chronicle:
      type: 'Hoerbiger.HoerbigerCom:Document.Chronicle'
      position: 384
    privacy:
      type: 'Hoerbiger.HoerbigerCom:Document.PrivacyPage'
      position: 512
    searchresults:
      type: 'Hoerbiger.HoerbigerCom:Document.SearchResultsPage'
      position: 640
    notfound:
      type: 'Hoerbiger.HoerbigerCom:Document.Error.404'
      position: 768
    assetdirectory:
      type: 'Hoerbiger.Shared:Document.AssetDirectory'
      position: 1024
  constraints:
    nodeTypes:
      'Hoerbiger.HoerbigerCom:Document.WebPage': true
      'Hoerbiger.HoerbigerCom:Document.Shortcut': true
  ui:
    icon: globe
    label: 'Homepage'
    inspector:
      groups:
        video:
          label: 'Video'
          icon: 'icon-video'
        menu:
          label: 'Footer'
          icon: 'shoe-prints'
          position: 10

  properties:
    video__source__desktop:
      type: 'Neos\Media\Domain\Model\Asset'
      ui:
        label: 'Video (Desktop)'
        reloadIfChanged: true
        inspector:
          group: 'video'
          position: 'before image'
          editorOptions:
            constraints:
              mediaTypes: ['video/mp4']
            accept:
              video/mp4
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': {}
    image:
      ui:
        label: 'Bild (Mobil)'
        reloadIfChanged: true
        inspector:
          group: 'video'
    image__alt:
      ui:
        inspector:
          group: 'video'
    image__title:
      ui:
        inspector:
          group: 'video'
    primaryFooter:
      type: references
      ui: &footerMenu
        label: 'Menüpunkte Primärer Footer'
        reloadIfChanged: true
        inspector:
          group: menu
          editorOptions:
            nodeTypes:
              - 'Hoerbiger.HoerbigerCom:Document'
              - 'Hoerbiger.HoerbigerCom:Document.Shortcut'
    secondaryFooter:
      type: references
      ui:
        <<: *footerMenu
        label: 'Menüpunkte Sekundärer Footer'
    tertiaryFooter:
      type: references
      ui:
        <<: *footerMenu
        label: 'Menüpunkte Tertiärer Footer'

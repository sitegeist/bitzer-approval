'Hoerbiger.HoerbigerCom:Content.ImageOverlappedByText':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Headline': true
    'Hoerbiger.HoerbigerCom:Mixin.Image': true
    'Hoerbiger.HoerbigerCom:Mixin.Link': true
    'Hoerbiger.HoerbigerCom:Mixin.Adjust': true
  ui:
    label: 'Image Overlapped By Text'
    icon: 'clone'
  properties:
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    text:
      type: string
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter text'
      options:
        preset: 'rte.text'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    variant:
      type: 'string'
      defaultValue: 'imageLeft'
      ui:
        label: 'Variant'
        reloadIfChanged: true
        inspector:
          group: adjust
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
  postprocessors:
    variants:
      postprocessor: PackageFactory\AtomicFusion\PresentationObjects\Application\EnumProvider
      postprocessorOptions:
        enumName: Hoerbiger\Shared\Presentation\Block\PartialFigureEclipse\PartialFigureEclipseVariant
        propertyNames:
          - variant

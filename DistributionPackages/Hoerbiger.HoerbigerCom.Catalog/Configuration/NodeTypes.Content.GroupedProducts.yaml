'Hoerbiger.HoerbigerCom.Catalog:Content.GroupedProducts':
  superTypes:
    'Neos.Neos:ContentCollection': true
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Image': true
  ui:
    icon: 'object-ungroup'
    label: 'Grouped Products'
    inspector:
      groups:
        products:
          label: 'Products'
          icon: 'barcode'
  properties:
    name:
      options:
        preset: 'rte.text'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter title'
      search:
        fulltextExtractor: ${Indexing.extractInto('h2', value)}
        elasticSearchMapping:
          type: text
    products:
      type: references
      ui:
        label: 'Product Pages'
        reloadIfChanged: true
        inspector:
          group: products
          editorOptions:
            nodeTypes:
              - 'Hoerbiger.HoerbigerCom.Catalog:Document.Product'
              - 'Hoerbiger.HoerbigerCom.Catalog:Document.ExternalProduct'

'Hoerbiger.HoerbigerCom:Content.Video':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.ImageWithCaption': true
  ui:
    label: 'Video'
    icon: video
    inspector:
      groups:
        video:
          label: 'Video'
          position: start
  properties:
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    video:
      type: 'Neos\Media\Domain\Model\Asset'
      ui:
        label: 'Video File'
        reloadIfChanged: true
        inspector:
          group: video
      constraints:
        mediaTypes: [ 'video/mp4' ]
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': {}
    image:
      validation: ~
    image__alt:
      validation: ~
    image__title:
      validation: ~

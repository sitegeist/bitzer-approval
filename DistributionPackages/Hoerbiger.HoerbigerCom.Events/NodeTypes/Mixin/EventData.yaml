'Hoerbiger.HoerbigerCom.Events:Mixin.EventData':
  abstract: true
  superTypes:
    'Hoerbiger.HoerbigerCom:Mixin.Image': true
  ui:
    inspector:
      groups:
        event:
          label: 'Event'
          icon: 'calendar-times'
          position: 'before image'
  properties:
    image:
      options:
        preset: 'image.24x5'
    startDate:
      type: DateTime
      ui:
        label: 'Start Date'
        inspector:
          group: event
          editorOptions:
            format: 'Y-m-d H:i'
      validation:
        Neos.Neos/Validation/NotEmptyValidator: {}
    endDate:
      type: DateTime
      ui:
        label: 'End Date'
        inspector:
          group: event
          editorOptions:
            format: 'Y-m-d H:i'
    location:
      type: string
      ui:
        label: 'Location'
        inspector:
          group: event
    detailedLocation:
      type: string
      ui:
        label: 'Hall / Stand'
        inspector:
          group: event
      options:
        automaticTranslation: true
    countryCode:
      type: string
      ui:
        label: 'Country'
        inspector:
          group: event
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
    type:
      type: string
      ui:
        label: 'Type'
        inspector:
          group: event
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            values:
              tradeShow:
                label: 'Trade Show'
              conference:
                label: 'Conference'
              techDays:
                label: 'Tech Days'
              training:
                label: 'Training'
              opening:
                label: 'Opening'
              other:
                label: 'Other'
    __year:
      search:
        indexing: "${Date.format(q(node).property('startDate'), 'Y')}"
        elasticSearchMapping:
          type: keyword
  postprocessors:
    countryCodes:
      postprocessor: Hoerbiger\Shared\Application\CountryCodeProvider
      postprocessorOptions:
        propertyNames:
          - countryCode

'Hoerbiger.HoerbigerCom:Mixin.Icon':
  abstract: true
  superTypes:
    'Hoerbiger.HoerbigerCom:Mixin.Adjust': true
  properties:
    icon:
      type: string
      ui:
        label: 'Icon'
        reloadIfChanged: true
        inspector:
          group: 'adjust'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
          editorOptions:
            dataSourceIdentifier: 'sitegeist-stampede-icons'
            dataSourceAdditionalData:
              collections: [shared]
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': {}

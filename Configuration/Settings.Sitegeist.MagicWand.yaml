Sitegeist:
  MagicWand:
    flowCommand: './flow'
    defaultPreset: 'master'
    clonePresets:
      develop:
        host: 'hoerbiger'
        port: 22
        path: '/srv/dockerdata/www-dev/www/hoerbiger_deployer/current'
        flowCommand: 'cd /srv/dockerdata/www-dev && docker-compose exec -T php php /var/www/html/hoerbiger_deployer/current/flow'
        dumpCommand: '"cd /srv/dockerdata/www-dev && docker-compose exec -T db mysqldump"'
        context: Production
        postClone:
          destroySession: './flow session:destroyall'
          removeDomains: './flow domain:delete "*"'
          addDomain: './flow domain:add hoerbiger-hoerbigercom hoerbiger.ddev.site'
          removeUser: './flow user:delete --assume-yes "*"'
          addAdminUser: './flow user:create --roles Administrator admin admin Admin Admin'
        resourceProxy:
          baseUri: https://www-dev.hoerbiger.com
          subdivideHashPathSegment: true

      staging:
        host: 'hoerbiger'
        port: 22
        path: '/srv/dockerdata/www-stage/www/hoerbiger_deployer/current'
        flowCommand: 'cd /srv/dockerdata/www-stage && docker-compose exec -T php php /var/www/html/hoerbiger_deployer/current/flow'
        dumpCommand: '"cd /srv/dockerdata/www-stage && docker-compose exec -T db mysqldump"'
        context: Production
        postClone:
          destroySession: './flow session:destroyall'
          removeDomains: './flow domain:delete "*"'
          addDomain: './flow domain:add hoerbiger-hoerbigercom hoerbiger.ddev.site'
          removeUser: './flow user:delete --assume-yes "*"'
          addAdminUser: './flow user:create --roles Administrator admin admin Admin Admin'
        resourceProxy:
          baseUri: https://www-stage.hoerbiger.com
          subdivideHashPathSegment: true

      master:
        host: 'hoerbiger'
        port: 22
        user: uext_arn
        path: '/srv/dockerdata/www-prod/www/hoerbiger_deployer/current'
        flowCommand: 'cd /srv/dockerdata/www-prod && docker-compose exec -T php php /var/www/html/hoerbiger_deployer/current/flow'
        dumpCommand: '"cd /srv/dockerdata/www-prod && docker-compose exec -T db mysqldump"'
        context: Production
        postClone:
          destroySession: './flow session:destroyall'
          removeDomains: './flow domain:delete "*"'
          addDomain: './flow domain:add hoerbiger-hoerbigercom hoerbiger.ddev.site'
          removeUser: './flow user:delete --assume-yes "*"'
          addAdminUser: './flow user:create --roles Administrator admin admin Admin Admin'
        resourceProxy:
          baseUri: https://www.hoerbiger.com
          subdivideHashPathSegment: true

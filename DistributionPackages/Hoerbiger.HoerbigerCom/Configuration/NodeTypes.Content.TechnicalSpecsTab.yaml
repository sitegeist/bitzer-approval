'Hoerbiger.HoerbigerCom:Content.TechnicalSpecsTab':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Neos.Neos:ContentCollection': true
  constraints:
    nodeTypes:
      '*': false
      'Hoerbiger.HoerbigerCom:Collection.List': true

  ui:
    label: 'Technische Spezifikation'
    icon: cog
  properties:
    name:
      type: string
      ui:
        inline:
          editorOptions:
            placeholder: 'Bitte Titel eingeben'
      options:
        preset: 'rte.plain'
    text:
      type: string
      ui:
        inline:
          editorOptions:
            placeholder: 'Bitte Text eingeben'
      options:
        preset: 'rte.text'

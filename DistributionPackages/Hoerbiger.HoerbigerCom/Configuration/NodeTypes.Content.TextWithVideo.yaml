'Hoerbiger.HoerbigerCom:Content.TextWithVideo':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Image': true
    'Hoerbiger.HoerbigerCom:Mixin.Text': true
    'Hoerbiger.HoerbigerCom:Mixin.Link': true
  ui:
    label: 'Text With Video'
    icon: id-card
    inspector:
      groups:
        layout:
          label: 'Layout'
          icon: eye
        video:
          label: 'Video'
          icon: video
        text:
          label: 'Text'
          icon: 'align-left'
  properties:
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    layout:
      type: string
      defaultValue: 'videoFirst'
      ui:
        label: 'Layout'
        reloadIfChanged: true
        inspector:
          group: 'layout'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
    column:
      type: string
      defaultValue: '50_50'
      ui:
        label: 'Spalten'
        reloadIfChanged: true
        inspector:
          group: 'layout'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
    showMobileVideoFirst:
      type: boolean
      defaultValue: false
      ui:
        label: 'Video first (on mobile)'
        reloadPageIfChanged: true
        inspector:
          group: 'layout'
    text__block__image:
      type: 'Neos\Media\Domain\Model\ImageInterface'
      ui:
        label: 'Image inside Text'
        reloadIfChanged: true
        inspector:
          group: 'text'
    text__block__image__alt:
      type: 'string'
      ui:
        label: 'Alt Text'
        inspector:
          group: 'text'
    text__block__image__title:
      type: 'string'
      ui:
        label: 'Title-Text'
        inspector:
          group: 'text'

    video:
      type: 'Neos\Media\Domain\Model\Asset'
      ui:
        label: 'Video File'
        reloadIfChanged: true
        inspector:
          hidden: 'ClientEval:!(node.properties.videoSource == "internal")'
          position: 3
          group: 'video'
      constraints:
        mediaTypes: [ 'video/mp4', 'video/webm' ]

    youtubeVideo:
      type: 'Hoerbiger\Shared\Domain\VideoIdentifier'
      ui:
        label: 'Video'
        reloadIfChanged: true
        inspector:
          hidden: 'ClientEval:!(node.properties.videoSource == "youtube")'
          position: 2
          group: 'video'
          editor: Sitegeist.InspectorGadget/Inspector/Editor
          editorOptions:
            isNullable: true
            labels:
              create: 'Video erstellen'
    videoSource:
      type: string
      defaultValue: 'internal'
      ui:
        label: 'Video source'
        reloadIfChanged: true
        inspector:
          position: 1
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          group: 'video'
          editorOptions:
            values:
              'internal':
                label: 'Intern'
              'youtube':
                label: 'YouTube'

    image:
      ui:
        label: 'Video Poster'
        inspector:
          group: 'video'
          position: 4
      validation: ~
    image__alt:
      ui:
        inspector:
          group: 'video'
          position: 5
      validation: ~
    image__title:
      ui:
        inspector:
          group: 'video'
          position: 6
      validation: ~

  postprocessors:
    layouts:
      postprocessor: PackageFactory\AtomicFusion\PresentationObjects\Application\EnumProvider
      postprocessorOptions:
        enumName: Hoerbiger\Shared\Presentation\EnumProvider\TextWithVideo\Layout
        propertyNames:
          - layout
    columns:
      postprocessor: PackageFactory\AtomicFusion\PresentationObjects\Application\EnumProvider
      postprocessorOptions:
        enumName: Hoerbiger\Shared\Presentation\EnumProvider\TextWithVideo\Columns
        propertyNames:
          - column

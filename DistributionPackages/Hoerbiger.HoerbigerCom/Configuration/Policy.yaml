#
# Security policy for the Hoerbiger.HoerbigerCom package
#

privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'Hoerbiger.HoerbigerCom:Stuff':
      matcher: 'method(Hoerbiger\HoerbigerCom\Application\Controller\StuffController->queryAction())'
    'Hoerbiger.HoerbigerCom:MostWanted':
      matcher: 'method(Hoerbiger\HoerbigerCom\Application\Controller\WantedNodeController->(register)Action())'
    'Hoerbiger.HoerbigerCom:ContactRequest':
      matcher: 'method(Hoerbiger\HoerbigerCom\Application\Controller\ContactRequestController->sendAction())'
    'Hoerbiger.HoerbigerCom:TranslationExport':
      matcher: 'method(Hoerbiger\HoerbigerCom\Application\Controller\TranslationController->exportDocumentAction())'
  'Neos\Neos\Security\Authorization\Privilege\ModulePrivilege':
    'Hoerbiger.HoerbigerCom:Module.MarketingUrls':
      matcher: 'management/marketingUrls'

roles:
  'Neos.Flow:Everybody':
    privileges:
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:Stuff'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:MostWanted'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:ContactRequest'
        permission: GRANT

  'Hoerbiger.Shared:TranslationEditor':
    privileges:
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:TranslationExport'
        permission: GRANT

  'Hoerbiger.Shared:ChiefEditor':
    privileges:
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:Module.MarketingUrls'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:TranslationExport'
        permission: GRANT

  'Neos.Neos:Administrator':
    privileges:
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:Module.MarketingUrls'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:TranslationExport'
        permission: GRANT

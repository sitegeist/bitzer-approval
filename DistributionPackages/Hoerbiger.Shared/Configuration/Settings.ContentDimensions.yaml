Neos:
  ContentRepository:
    contentDimensions:
      language:
        default: de
        defaultPreset: de
        label: Language
        icon: icon-language
        presets:
          de:
            label: Deutsch
            values: ['de']
            uriSegment: de
            options:
              translationStrategy: 'once'
          en:
            label: English
            values: ['en']
            uriSegment: en
            options:
              translationStrategy: 'once'
          zh:
            label: Chinese
            values: ['zh']
            uriSegment: zh
            options:
              translationStrategy: 'once'
          ja:
            label: Japanese
            values: [ 'ja' ]
            uriSegment: ja
            options:
              translationStrategy: 'once'
          es:
            label: Spanish
            values: [ 'es' ]
            uriSegment: es
            options:
              translationStrategy: 'once'

  Neos:
    routing:
      supportEmptySegmentForDimensions: false

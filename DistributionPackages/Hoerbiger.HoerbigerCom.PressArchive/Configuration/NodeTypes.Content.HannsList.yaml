'Hoerbiger.HoerbigerCom.PressArchive:Content.HannsList':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Headline': true
    'Hoerbiger.HoerbigerCom:Mixin.Link': true
  ui:
    label: 'Hanns List'
    icon: star
    inspector:
      groups:
        hanns:
          label: 'Hanns'
          icon: 'star'
        accordionOption:
          label: Accordion Settings
          icon: 'folder-open'
        image:
          label: Image
          icon: 'image'
  properties:
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    news:
      type: references
      ui:
        label: 'Hanns Releases'
        reloadPageIfChanged: true
        inspector:
          group: 'hanns'
          editorOptions:
            nodeTypes:
              - 'Hoerbiger.HoerbigerCom.PressArchive:Document.HannsRelease'
    linkLabel:
      type: string
      ui:
        label: 'Link-Label'
        reloadIfChanged: true
        inspector:
          group: 'news'
      options:
        automaticTranslation: true
    isAccordionOpen:
      type: boolean
      defaultValue: true
      ui:
        reloadIfChanged: true
        label: 'is Accordion Open?'
        inspector:
          group: 'accordionOption'
    layout:
      type: string
      defaultValue: 'imageFirst'
      ui:
        label: 'Layout'
        reloadIfChanged: true
        inspector:
          group: 'image'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
  postprocessors:
    layouts:
      postprocessor: PackageFactory\AtomicFusion\PresentationObjects\Application\EnumProvider
      postprocessorOptions:
        enumName: Hoerbiger\Shared\Presentation\Block\Card\HannsReleaseCard\HannsReleaseCardVariant
        propertyNames:
          - layout

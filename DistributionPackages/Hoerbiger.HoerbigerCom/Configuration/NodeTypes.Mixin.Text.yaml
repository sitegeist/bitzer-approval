'Hoerbiger.HoerbigerCom:Mixin.Text':
  abstract: true
  ui:
    inspector:
      groups:
        table:
          label: 'Table Settings'
          icon: 'table'
  superTypes:
    'Hoerbiger.HoerbigerCom:Mixin.Headline': true
  properties:
    text:
      options:
        preset: 'rte.text'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter text'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text

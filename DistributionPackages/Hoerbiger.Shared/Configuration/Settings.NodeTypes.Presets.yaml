Neos:
  Neos:
    nodeTypes:
      presets:
        properties:
          'rte':
            'plain':
              type: 'string'
              ui:
                inlineEditable: true
                inline:
                  editorOptions:
                    autoparagraph: false
                    hyphens: true
                    formatting:
                      removeFormat: true
                      sup: true
                      sub: true
            'text':
              type: 'string'
              ui:
                inlineEditable: true
                inline:
                  editorOptions:
                    autoparagraph: true
                    hyphens: true
                    linking:
                      anchor: true
                      title: true
                      relNofollow: true
                      targetBlank: true
                    formatting:
                      strong: true
                      p: true
                      ol: true
                      ul: true
                      sub: true
                      sup: true
                      a: true
                      removeFormat: true
            'plainWithStrong':
              type: 'string'
              ui:
                inlineEditable: true
                inline:
                  editorOptions:
                    hyphens: true
                    autoparagraph: false
                    formatting:
                      strong: true
                      removeFormat: true
          'image':
            'square':
              type: 'Neos\Media\Domain\Model\ImageInterface'
              ui:
                inspector:
                  group: 'image'
                  editorOptions:
                    features:
                      crop: true
                    crop:
                      aspectRatio:
                        forceCrop: true
                        locked:
                          width: 1
                          height: 1
            'landscape':
              type: 'Neos\Media\Domain\Model\ImageInterface'
              ui:
                inspector:
                  group: 'image'
                  editorOptions:
                    features:
                      crop: true
                    crop:
                      aspectRatio:
                        forceCrop: true
                        locked:
                          width: 2
                          height: 1
            'landscape_5_2':
              type: 'Neos\Media\Domain\Model\ImageInterface'
              ui:
                inspector:
                  group: 'image'
                  editorOptions:
                    features:
                      crop: true
                    crop:
                      aspectRatio:
                        forceCrop: true
                        locked:
                          width: 5
                          height: 2
            'panorama':
              type: 'Neos\Media\Domain\Model\ImageInterface'
              ui:
                inspector:
                  group: 'image'
                  editorOptions:
                    features:
                      crop: true
                    crop:
                      aspectRatio:
                        forceCrop: true
                        locked:
                          width: 3
                          height: 1
            'portrait':
              type: 'Neos\Media\Domain\Model\ImageInterface'
              ui:
                inspector:
                  group: 'image'
                  editorOptions:
                    features:
                      crop: true
                    crop:
                      aspectRatio:
                        forceCrop: true
                        locked:
                          width: 3
                          height: 4
            '5_4':
              type: 'Neos\Media\Domain\Model\ImageInterface'
              ui:
                inspector:
                  group: 'image'
                  editorOptions:
                    features:
                      crop: true
                    crop:
                      aspectRatio:
                        forceCrop: true
                        locked:
                          width: 5
                          height: 4
            '5_3':
              type: 'Neos\Media\Domain\Model\ImageInterface'
              ui:
                inspector:
                  group: 'image'

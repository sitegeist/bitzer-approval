'Hoerbiger.HoerbigerCom:Content.Text':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Text': true
    'Hoerbiger.HoerbigerCom:Mixin.Adjust': true
    'Hoerbiger.HoerbigerCom:Mixin.Link': true
  ui:
    label: 'Text'
    icon: align-left
  properties:
    headline:
      options:
        preset: 'rte.plain'
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    columns:
      type: string
      defaultValue: maxTwo
      ui:
        label: 'Columns and Width'
        reloadIfChanged: true
        inspector:
          group: 'adjust'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
    hasStickyTableHeader:
      type: boolean
      defaultValue: false
      ui:
        reloadIfChanged: true
        label: 'Table with Sticky Column'
        inspector:
          group: table

  postprocessors:
    columns:
      postprocessor: PackageFactory\AtomicFusion\PresentationObjects\Application\EnumProvider
      postprocessorOptions:
        enumName: Hoerbiger\Shared\Presentation\EnumProvider\Text\Columns
        propertyNames:
          - columns

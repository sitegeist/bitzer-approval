'Hoerbiger.HoerbigerCom:Mixin.Introduction':
  abstract: true
  superTypes:
    'Hoerbiger.HoerbigerCom:Mixin.Headline': true
    'Hoerbiger.HoerbigerCom:Mixin.Image': true
  ui:
    inspector:
      groups:
        image:
          label: 'Key Visual'
          position: 'after document'
  properties:
    image:
      options:
        preset: 'image.landscape'
    abstract:
      ui:
        inline:
          editorOptions:
            placeholder: 'Bitte Zusammenfassung eingeben'
      options:
        preset: 'rte.text'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}

'Hoerbiger.HoerbigerCom:Mixin.Introduction.FullMedia':
  superTypes:
    'Hoerbiger.HoerbigerCom:Mixin.Adjust': true
    'Hoerbiger.HoerbigerCom:Mixin.Introduction': true
    'Hoerbiger.HoerbigerCom:Mixin.Link': true
  ui:
    inspector:
      groups:
        adjust:
          position: after image
  properties:
    image:
      options:
        preset: 'image.landscape'
    metaline:
      ui:
        inline:
          editorOptions:
            placeholder: 'Bitte Metaline eingeben'
      options:
        preset: 'rte.text'
      search:
        fulltextExtractor: ${Indexing.extractInto('h2', value)}
        elasticSearchMapping:
          type: text
    stage__variant:
      type: 'string'
      defaultValue: 'fullMediaTextLeft'
      ui:
        label: 'Layout'
        reloadIfChanged: true
        inspector:
          position: 2
          group: adjust
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
  postprocessors:
    stage__variants:
      postprocessor: PackageFactory\AtomicFusion\PresentationObjects\Application\PseudoEnumProvider
      postprocessorOptions:
        enumName: Hoerbiger\HoerbigerCom\Presentation\EnumProvider\Introduction\StageVariant
        propertyNames:
          - stage__variant

'Hoerbiger.HoerbigerCom:Mixin.Introduction.Stack':
  superTypes:
    'Hoerbiger.HoerbigerCom:Mixin.Introduction': true
  ui:
    inspector:
      groups:
        adjust:
          position: after image
  properties:
    image:
      options:
        preset: 'image.landscape'
    alternativeHeadline:
      ui:
        inline:
          editorOptions:
            placeholder: 'Bitte Überschrift eingeben'
      options:
        preset: 'rte.plain'

'Hoerbiger.HoerbigerCom:Document':
  abstract: true
  ui:
    inspector:
      groups:
        contactWidget:
          label: 'Kontakt-Widget'
          icon: 'at'

  superTypes:
    'Neos.Neos:Document': true
  constraints:
    nodeTypes:
      '*': false
      'Neos.Neos:Document': false
  properties:
    lastUpdateAction:
      type: DateTime
    showContactWidget:
      type: boolean
      defaultValue: true
      ui:
        label: 'Kontakt-Widget anzeigen'
        reloadPageIfChanged: true
        inspector:
          group: contactWidget

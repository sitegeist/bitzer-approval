'Hoerbiger.HoerbigerCom:Content':
  abstract: true
  superTypes:
    'Neos.Neos:Content': true
  ui:
    inspector:
      groups:
        anchor:
          label: 'Anchor'
          icon: 'anchor'
          position: start 0
  properties:
    anchorLabel:
      type: string
      ui:
        label: 'Anchor Label'
        reloadPageIfChanged: true
        help:
          message: >-
            ClientEval:node.properties.anchorLabel
              ? '#' + node.properties.anchorLabel
                  .toLowerCase()
                  .replace(/[äüöß]/g, char => ({ä:'ae', ü:'ue', ö:'oe', ß:'ss'})[char])
                  .replace(/[^a-z0-9_\s-]/g, '')
                  .replace(/[\s_-]+/g, ' ')
                  .replace(/[\s_-]/g, '-')
              : ''
        inspector:
          group: 'anchor'
    lastUpdateAction:
      type: DateTime
    showAnchor:
      type: boolean
      defaultValue: false
      ui:
        label: 'Show Anchor'
        inspector:
          group: 'anchor'

'Hoerbiger.HoerbigerCom:Content.Image':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.ImageWithCaption': true
  ui:
    label: 'Image'
    icon: image
  properties:
    image:
      options:
        preset: 'image.landscape_2_1'
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text

'Hoerbiger.HoerbigerCom.PressArchive:Content.TopNews':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Headline': true
  ui:
    label: 'Top News'
    icon: star
    inspector:
      groups:
        news:
          label: 'News'
          icon: 'star'
  properties:
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Bitte Überschrift eingeben'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    news:
      type: references
      ui:
        label: 'Top News'
        reloadIfChanged: true
        inspector:
          group: 'news'
          editorOptions:
            nodeTypes:
              - 'Hoerbiger.HoerbigerCom.PressArchive:Document.HannsRelease'
              - 'Hoerbiger.HoerbigerCom.PressArchive:Document.PressRelease'
              - 'Hoerbiger.HoerbigerCom.PressArchive:Document.YearbookRelease'
    category:
      type: string
      ui:
        label: 'Link auf Kategorie'
        reloadIfChanged: true
        inspector:
          group: 'news'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
          editorOptions:
            allowEmpty: true
            values:
              news:
                label: 'News'
              yearbook:
                label: 'Jahrbuch'
              hanns:
                label: 'HANNS.'
    linkLabel:
      type: string
      ui:
        label: 'Link-Label'
        reloadIfChanged: true
        inspector:
          group: 'news'
      options:
        automaticTranslation: true

'Hoerbiger.HoerbigerCom:Document.HomePage':
  childNodes:
    main:
      constraints:
        nodeTypes:
          'Hoerbiger.HoerbigerCom.PressArchive:Content.TopNews': true

'Hoerbiger.HoerbigerCom:Document.WebPage':
  childNodes:
    main:
      constraints:
        nodeTypes:
          'Hoerbiger.HoerbigerCom.PressArchive:Content.TopNews': true

'Hoerbiger.HoerbigerCom.Catalog:Document.IndustrySolutions':
  childNodes:
    main:
      constraints:
        nodeTypes:
          'Hoerbiger.HoerbigerCom.PressArchive:Content.TopNews': true

'Hoerbiger.HoerbigerCom.Catalog:Document.IndustrySolution':
  childNodes:
    main:
      constraints:
        nodeTypes:
          'Hoerbiger.HoerbigerCom.PressArchive:Content.TopNews': true

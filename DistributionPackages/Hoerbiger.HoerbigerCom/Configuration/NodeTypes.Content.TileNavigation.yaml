'Hoerbiger.HoerbigerCom:Content.TileNavigation':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
  ui:
    label: 'Kachelnavigation'
    icon: 'th-large'
    inspector:
      groups:
        elements:
          label: 'Elemente'
          icon: 'th-large'
  properties:
    metaHeadline:
      options:
        preset: 'rte.plainWithStrong'
      ui:
        inline:
          editorOptions:
            placeholder: 'Bitte Überschrift eingeben'
      search:
        fulltextExtractor: ${Indexing.extractInto('p', value)}
        elasticSearchMapping:
          type: text
    documents:
      type: references
      ui:
        label: 'Seiten'
        reloadIfChanged: true
        inspector:
          group: 'elements'

#
# Security policy for the Hoerbiger.HoerbigerCom package
#

privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'Hoerbiger.HoerbigerCom:Stuff':
      matcher: 'method(Hoerbiger\HoerbigerCom\Application\Controller\StuffController->queryAction())'
    'Hoerbiger.HoerbigerCom:MostWanted':
      matcher: 'method(Hoerbiger\HoerbigerCom\Application\Controller\WantedNodeController->(register)Action())'
    'Hoerbiger.HoerbigerCom:ContactRequest':
      matcher: 'method(Hoerbiger\HoerbigerCom\Application\Controller\ContactRequestController->sendAction())'

roles:
  'Neos.Flow:Everybody':
    privileges:
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:Stuff'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:MostWanted'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.HoerbigerCom:ContactRequest'
        permission: GRANT

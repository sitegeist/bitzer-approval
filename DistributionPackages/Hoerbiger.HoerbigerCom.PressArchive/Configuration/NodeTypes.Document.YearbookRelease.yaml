'Hoerbiger.HoerbigerCom.PressArchive:Document.YearbookRelease':
  superTypes:
    'Hoerbiger.HoerbigerCom:Document': true
    'Hoerbiger.HoerbigerCom:Mixin.Introduction.Stack': true
    'Hoerbiger.HoerbigerCom:Mixin.Preview': true
    'Hoerbiger.Shared:Mixin.Searchable': true
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': false
          'Hoerbiger.HoerbigerCom:Content.Image': true
          'Hoerbiger.HoerbigerCom:Content.NewsQuotation': true
          'Hoerbiger.HoerbigerCom:Content.TextWithMetaText': true
  ui:
    icon: book
    label: 'Yearbook'
    inspector:
      groups:
        magazin:
          label: 'Magazin'
          icon: 'file-invoice'
          position: 'before image'
  properties:
    datePublished:
      type: DateTime
      ui:
        label: 'Date of Publication'
        inspector:
          group: magazin
    edition:
      type: string
      ui:
        label: 'Edition'
        reloadIfChanged: true
        inspector:
          group: magazin
    searchType:
      search:
        indexing: '${"PressRelease"}'
    preview__image:
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': [ ]
    preview__image__alt:
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': [ ]
    preview__image__title:
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': [ ]

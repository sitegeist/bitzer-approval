'Hoerbiger.Shared:Adapter.AssetCollection':
  class: 'Hoerbiger\Shared\Domain\Asset\AssetCollectionAdapter'
  superTypes:
    'Neos.Neos:Document': true
    'Hoerbiger.Shared:Tag.DocumentTreeItem': false
    'Hoerbiger.Shared:Tag.ExcludeFromNavigation': true
  constraints:
    nodeTypes:
      '*': false
      'Hoerbiger.Shared:Adapter.Asset': true
  ui:
    label: 'Asset Collection'
    icon: 'photo-video'
  properties:
    name:
      type: string
      search:
        fulltextExtractor: ${Indexing.extractInto('h2', value)}
        elasticSearchMapping:
          type: text

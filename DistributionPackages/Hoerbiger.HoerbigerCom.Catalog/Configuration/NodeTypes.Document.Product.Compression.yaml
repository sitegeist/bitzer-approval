'Hoerbiger.HoerbigerCom.Catalog:Document.Product.Compression':
  superTypes:
    'Hoerbiger.HoerbigerCom.Catalog:Document.Product': true
  ui:
    label: 'Compression Product'
  childNodes:
    main:
      constraints:
        nodeTypes:
          'Hoerbiger.HoerbigerCom.Catalog:Content.PaybackCalculatorEVCP': true
  properties:
    productClass:
      type: string
      defaultValue: 'default'
      ui:
        label: 'Product Class'
        reloadIfChanged: true
        inspector:
          group: product
          position: 'start'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
      validation:
        Neos.Neos/Validation/NotEmptyValidator: {}
  postprocessors:
    productClass:
      postprocessor: Hoerbiger\HoerbigerCom\Catalog\Application\ProductClassProvider

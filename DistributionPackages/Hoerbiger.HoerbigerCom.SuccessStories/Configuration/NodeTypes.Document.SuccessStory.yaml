'Hoerbiger.HoerbigerCom.SuccessStories:Document.SuccessStory':
  superTypes:
    'Hoerbiger.HoerbigerCom:Document': true
    'Hoerbiger.HoerbigerCom:Mixin.Introduction.FullMedia': true
    'Hoerbiger.HoerbigerCom:Mixin.Preview': true
    'Hoerbiger.Shared:Mixin.Searchable': true
  childNodes:
    main:
      type: 'Neos.Neos:ContentCollection'
      constraints:
        nodeTypes:
          '*': false
          'Hoerbiger.HoerbigerCom:Content.ImageOverlappedByText': true
          'Hoerbiger.HoerbigerCom:Content.TileNavigation': true
          'Hoerbiger.HoerbigerCom:Collection.Gallery': true
          'Hoerbiger.HoerbigerCom:Collection.Gallery.Square': true
          'Hoerbiger.HoerbigerCom:Collection.Gallery.Portrait': true
          'Hoerbiger.HoerbigerCom:Content.Image': true
          'Hoerbiger.HoerbigerCom:Content.Quotation': true
          'Hoerbiger.HoerbigerCom:Content.Text': true
          'Hoerbiger.HoerbigerCom:Content.Accordion': true
          'Hoerbiger.HoerbigerCom:Content.TextWithImage': true
          'Hoerbiger.HoerbigerCom:Content.DummyText': true
          'Hoerbiger.HoerbigerCom:Content.DummyTextWithImage': true
          'Hoerbiger.HoerbigerCom:Collection.Teaser': true
          'Hoerbiger.HoerbigerCom:Collection.Downloads': true
          'Hoerbiger.HoerbigerCom:Content.Video': true
          'Hoerbiger.HoerbigerCom.Catalog:Collection.ProductList': true
  ui:
    icon: file-invoice
    label: 'Success Story'
    inspector:
      groups:
        story:
          label: 'Story'
          icon: 'file-invoice'
          position: 'before image'
  properties:
    datePublished:
      type: DateTime
      ui:
        label: 'Date of Publication'
        inspector:
          group: story
    applicationWorld:
      type: reference
      ui:
        label: 'Application World'
        reloadIfChanged: true
        inspector:
          group: story
          editorOptions:
            nodeTypes:
              - 'Hoerbiger.HoerbigerCom.ApplicationWorlds:Document.ApplicationWorld'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': {}
    alternativeHeadline:
      ui:
        inline:
          editorOptions:
            placeholder: 'Please enter headline'
      options:
        preset: 'rte.plain'
    searchType:
      search:
        indexing: '${"SuccessStory"}'

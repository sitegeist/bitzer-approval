Sitegeist:
  MagicWand:
    flowCommand: './flow'
    defaultPreset: 'main'
    clonePresets:
      develop:
        host: 'vpro0993.proserver.punkt.de'
        user: proserver
        port: 22
        sshOptions: '-o "ProxyJump=jumping@ssh-jumphost.karlsruhe.punkt.de" '
        path: '/var/www/vhosts/www-dev.hoerbiger.com/current'
        context: Production
        postClone:
          destroySession: './flow session:destroyall'
          removeDomains: './flow domain:delete "*"'
          addDomain: './flow domain:add hoerbiger-hoerbigercom hoerbiger.ddev.site'
          removeUser: './flow user:delete --assume-yes "*"'
          addAdminUser: './flow user:create --roles Administrator admin admin Admin Admin'
        resourceProxy:
          baseUri: https://www-dev.hoerbiger.com
          subdivideHashPathSegment: true

      staging:
        host: 'vpro0993.proserver.punkt.de'
        user: proserver
        port: 22
        sshOptions: '-o "ProxyJump=jumping@ssh-jumphost.karlsruhe.punkt.de" '
        path: '/var/www/vhosts/www-stage.hoerbiger.com/current'
        context: Production
        postClone:
          destroySession: './flow session:destroyall'
          removeDomains: './flow domain:delete "*"'
          addDomain: './flow domain:add hoerbiger-hoerbigercom hoerbiger.ddev.site'
          removeUser: './flow user:delete --assume-yes "*"'
          addAdminUser: './flow user:create --roles Administrator admin admin Admin Admin'
        resourceProxy:
          baseUri: https://www-stage.hoerbiger.com
          subdivideHashPathSegment: true

      main:
        host: 'vpro0994.proserver.punkt.de'
        user: proserver
        port: 22
        sshOptions: '-o "ProxyJump=jumping@ssh-jumphost.karlsruhe.punkt.de" '
        path: '/var/www/vhosts/www.hoerbiger.com/current'
        context: Production
        postClone:
          destroySession: './flow session:destroyall'
          removeDomains: './flow domain:delete "*"'
          addDomain: './flow domain:add hoerbiger-hoerbigercom hoerbiger.ddev.site'
          removeUser: './flow user:delete --assume-yes "*"'
          addAdminUser: './flow user:create --roles Administrator admin admin Admin Admin'
        resourceProxy:
          baseUri: https://www.hoerbiger.com
          subdivideHashPathSegment: true

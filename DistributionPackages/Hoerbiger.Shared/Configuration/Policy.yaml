privilegeTargets:
  'Neos\Neos\Security\Authorization\Privilege\ModulePrivilege':
    'Hoerbiger.Shared:Module.Editors':
      matcher: 'administration/editors'
  'Neos\Neos\Security\Authorization\Privilege\NodeTreePrivilege':
    'Hoerbiger.Shared:AccessAllSubgraphs': &allSubgraphs
      matcher: 'TRUE'
    'Hoerbiger.Shared:AccessEnglishSubgraph': &englishSubgraph
      matcher: 'isInDimensionPreset("language", "en")'
    'Hoerbiger.Shared:AccessGermanSubgraph': &germanSubgraph
      matcher: 'isInDimensionPreset("language", "de")'
    'Hoerbiger.Shared:AccessChineseSubgraph': &chineseSubgraph
      matcher: 'isInDimensionPreset("language", "zh")'
    'Hoerbiger.Shared:AccessJapaneseSubgraph': &japaneseSubgraph
      matcher: 'isInDimensionPreset("language", "ja")'
    'Hoerbiger.Shared:AccessSpanishSubgraph': &spanishSubgraph
      matcher: 'isInDimensionPreset("language", "es")'
    'Hoerbiger.Shared:AccessBrazilianSubgraph': &brazilianSubgraph
      matcher: 'isInDimensionPreset("language", "pt-BR")'

  'Neos\ContentRepository\Security\Authorization\Privilege\Node\EditNodePropertyPrivilege':
    'Hoerbiger.Shared:EditPropertiesInAllSubgraphs': *allSubgraphs
    'Hoerbiger.Shared:EditPropertiesInEnglishSubgraph': *englishSubgraph
    'Hoerbiger.Shared:EditPropertiesInGermanSubgraph': *germanSubgraph
    'Hoerbiger.Shared:EditPropertiesInChineseSubgraph': *chineseSubgraph
    'Hoerbiger.Shared:EditPropertiesInJapaneseSubgraph': *japaneseSubgraph
    'Hoerbiger.Shared:EditPropertiesInSpanishSubgraph': *spanishSubgraph
    'Hoerbiger.Shared:EditPropertiesInBrazilianSubgraph': *brazilianSubgraph

  'Neos\ContentRepository\Security\Authorization\Privilege\Node\EditNodePrivilege':
    'Hoerbiger.Shared:EditNodesInAllSubgraphs': *allSubgraphs
    'Hoerbiger.Shared:EditNodesInEnglishSubgraph': *englishSubgraph
    'Hoerbiger.Shared:EditNodesInGermanSubgraph': *germanSubgraph
    'Hoerbiger.Shared:EditNodesInChineseSubgraph': *chineseSubgraph
    'Hoerbiger.Shared:EditNodesInJapaneseSubgraph': *japaneseSubgraph
    'Hoerbiger.Shared:EditNodesInSpanishSubgraph': *spanishSubgraph
    'Hoerbiger.Shared:EditNodesInBrazilianSubgraph': *brazilianSubgraph

  'Neos\ContentRepository\Security\Authorization\Privilege\Node\RemoveNodePrivilege':
    'Hoerbiger.Shared:RemoveNodesFromAllSubgraphs': *allSubgraphs
    'Hoerbiger.Shared:RemoveNodesFromEnglishSubgraph': *englishSubgraph
    'Hoerbiger.Shared:RemoveNodesFromGermanSubgraph': *germanSubgraph
    'Hoerbiger.Shared:RemoveNodesFromChineseSubgraph': *chineseSubgraph
    'Hoerbiger.Shared:RemoveNodesFromJapaneseSubgraph': *japaneseSubgraph
    'Hoerbiger.Shared:RemoveNodesFromSpanishSubgraph': *spanishSubgraph
    'Hoerbiger.Shared:RemoveNodesFromBrazilianSubgraph': *brazilianSubgraph

  'Neos\ContentRepository\Security\Authorization\Privilege\Node\CreateNodePrivilege':
    'Hoerbiger.Shared:CreateNodesInAllSubgraphs': *allSubgraphs
    'Hoerbiger.Shared:CreateNodesInEnglishSubgraph': *englishSubgraph
    'Hoerbiger.Shared:CreateNodesInGermanSubgraph': *germanSubgraph
    'Hoerbiger.Shared:CreateNodesInChineseSubgraph': *chineseSubgraph
    'Hoerbiger.Shared:CreateNodesInJapaneseSubgraph': *japaneseSubgraph
    'Hoerbiger.Shared:CreateNodesInSpanishSubgraph': *spanishSubgraph
    'Hoerbiger.Shared:CreateNodesInBrazilianSubgraph': *brazilianSubgraph

roles:
  'Neos.Neos:Administrator':
    privileges:
      -
        privilegeTarget: 'Hoerbiger.Shared:Module.Editors'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:AccessAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditPropertiesInAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditNodesInAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:RemoveNodesFromAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:CreateNodesInAllSubgraphs'
        permission: GRANT

  'Neos.Neos:Editor':
    privileges:
      -
        privilegeTarget: 'Hoerbiger.Shared:AccessAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditPropertiesInAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditNodesInAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:RemoveNodesFromAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:CreateNodesInAllSubgraphs'
        permission: GRANT

  'Hoerbiger.Shared:TranslationEditor':
    abstract: true

  'Hoerbiger.Shared:ChineseEditor':
    label: 'Redaktion China'
    parentRoles:
      - 'Neos.Neos:AbstractEditor'
      - 'Neos.Neos:LivePublisher'
      - 'Sitegeist.CsvPO:TranslationEditor'
      - 'Hoerbiger.Shared:TranslationEditor'
      - 'Sitegeist.Bitzer:Agent'
    privileges:
      -
        privilegeTarget: 'Hoerbiger.Shared:AccessChineseSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditPropertiesInChineseSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditNodesInChineseSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:RemoveNodesFromChineseSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:CreateNodesInChineseSubgraph'
        permission: GRANT

  'Hoerbiger.Shared:JapaneseEditor':
    label: 'Redaktion Japan'
    parentRoles:
      - 'Neos.Neos:AbstractEditor'
      - 'Neos.Neos:LivePublisher'
      - 'Sitegeist.CsvPO:TranslationEditor'
      - 'Hoerbiger.Shared:TranslationEditor'
      - 'Sitegeist.Bitzer:Agent'
    privileges:
      -
        privilegeTarget: 'Hoerbiger.Shared:AccessJapaneseSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditPropertiesInJapaneseSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditNodesInJapaneseSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:RemoveNodesFromJapaneseSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:CreateNodesInJapaneseSubgraph'
        permission: GRANT

  'Hoerbiger.Shared:SpanishEditor':
    label: 'Redaktion Spain'
    parentRoles:
      - 'Neos.Neos:AbstractEditor'
      - 'Neos.Neos:LivePublisher'
      - 'Sitegeist.CsvPO:TranslationEditor'
      - 'Hoerbiger.Shared:TranslationEditor'
      - 'Sitegeist.Bitzer:Agent'
    privileges:
      -
        privilegeTarget: 'Hoerbiger.Shared:AccessSpanishSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditPropertiesInSpanishSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditNodesInSpanishSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:RemoveNodesFromSpanishSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:CreateNodesInSpanishSubgraph'
        permission: GRANT

  'Hoerbiger.Shared:BrazilianEditor':
    label: 'Redaktion Brasilien'
    parentRoles:
      - 'Neos.Neos:AbstractEditor'
      - 'Neos.Neos:LivePublisher'
      - 'Sitegeist.CsvPO:TranslationEditor'
      - 'Hoerbiger.Shared:TranslationEditor'
      - 'Sitegeist.Bitzer:Agent'
    privileges:
      -
        privilegeTarget: 'Hoerbiger.Shared:AccessBrazilianSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditPropertiesInBrazilianSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditNodesInBrazilianSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:RemoveNodesFromBrazilianSubgraph'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:CreateNodesInBrazilianSubgraph'
        permission: GRANT

  'Neos.Neos:RestrictedEditor':
    label: 'Editor'
    privileges:
      -
        privilegeTarget: 'Hoerbiger.Shared:AccessAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditPropertiesInAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:EditNodesInAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:RemoveNodesFromAllSubgraphs'
        permission: GRANT
      -
        privilegeTarget: 'Hoerbiger.Shared:CreateNodesInAllSubgraphs'
        permission: GRANT
  'Hoerbiger.Shared:ChiefEditor':
    label: Chief Editor
    description: Grants access to the content, asset, workspace and history module. Users with this role is able to publish to the live workspace.
    parentRoles:
      - 'Neos.Neos:Editor'
      - 'Sitegeist.Bitzer:Administrator'
      - 'Sitegeist.Bitzer:Agent'

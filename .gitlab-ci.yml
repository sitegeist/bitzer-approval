#
# hoerbiger.com GitLab CI configuration
#

stages:
  - 'housekeeping'
  - 'testing'
  - 'deploy'

services:
  - name: git.sitegeist.de:4567/sitegeist/shadowsocks:latest
    alias: shadowsocks

#
# Automatically create merge requests for feature branches to development, staging and master
#
merge-requests:
  tags:
    - fastlane
  only:
    - /^(\d)+[^/]*$/
  stage: housekeeping
  script:
    # extract parts from branch name
    - mrTicketNumber=$(echo "$CI_BUILD_REF_NAME" | cut -s -d- -f1)
    - mrTicketTitle=$(echo "$CI_BUILD_REF_NAME" | cut -s -d- -f2 | sed -r 's/[[:upper:]]/ &/g' | tr "[:upper:]" "[:lower:]")

    # build title and description
    - 'mrTitle="$mrTicketTitle #$mrTicketNumber"'
    - 'mrDescription="Automatically created merge request"'

    # create merge requests for development, staging and master
    - 'mr -p $CI_PROJECT_ID -s $CI_COMMIT_REF_NAME -d develop --title "$mrTitle" --description "$mrDescription" --labels develop'
    - 'mr -p $CI_PROJECT_ID -s $CI_COMMIT_REF_NAME -d staging --title "WIP: $mrTitle" --description "$mrDescription" --labels staging'
    - 'mr -p $CI_PROJECT_ID -s $CI_COMMIT_REF_NAME -d master --title "WIP: $mrTitle" --description "$mrDescription" --labels master'

tests:
  image: git.sitegeist.de:4567/sitegeist/automata/deployment-php
  tags:
    - docker
    - autoscale
  cache:
    key: kvh
    paths:
      - .composer/
  stage: 'testing'
  only:
    - /^(\d)+[^/]*$/
    - develop
    - staging
    - master
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts'
    - '[[ -f /.dockerenv ]] && echo "$SSH_CONFIG" > ~/.ssh/config'
    - docker-php-ext-install exif
    - composer install
  script:
    - FLOW_CONTEXT=Testing bin/phpunit -c Build/BuildEssentials/PhpUnit/UnitTests.xml DistributionPackages/Kvh.KvhhNet.MedicalStaff/Tests/Unit/Domain/Command/SynchronizePhysiciansTest.php
    - FLOW_CONTEXT=Testing bin/phpunit -c Build/BuildEssentials/PhpUnit/UnitTests.xml DistributionPackages/Kvh.ShopKvhhNet/Tests/Unit/Domain/MedicalStaff/MedicalNumberTest.php
    - FLOW_CONTEXT=Testing bin/phpunit -c Build/BuildEssentials/PhpUnit/UnitTests.xml DistributionPackages/Kvh.ShopKvhhNet/Tests/Unit/Domain/Stock/StockReportTest.php
    - FLOW_CONTEXT=Testing bin/phpunit -c Build/BuildEssentials/PhpUnit/UnitTests.xml DistributionPackages/Kvh.ShopKvhhNet/Tests/Unit/Domain/Integrity/HappenedCriticallyLongAgoTest.php

deployment-develop:
  image: git.sitegeist.de:4567/sitegeist/automata/deployment-php
  tags:
    - docker
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .yarn-cache/
      - .composer/
  stage: deploy
  only:
    - develop
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts'
    - '[[ -f /.dockerenv ]] && echo "$SSH_CONFIG" > ~/.ssh/config'
    - mkdir -p /usr/node_modules
    - npm install --prefix /usr node@12.14.1
    - docker-php-ext-install exif
  environment:
    name: 'develop'
    url: 'https://develop.kvhh.net/'
  script:
    - composer install
    - make deploy-develop PATH=/usr/node_modules/.bin:$PATH

deployment-staging:
  image: git.sitegeist.de:4567/sitegeist/automata/deployment-php
  tags:
    - docker
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .yarn-cache/
      - .composer/
  stage: deploy
  only:
    - staging
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts'
    - '[[ -f /.dockerenv ]] && echo "$SSH_CONFIG" > ~/.ssh/config'
    - mkdir -p /usr/node_modules
    - npm install --prefix /usr node@12.14.1
    - docker-php-ext-install exif
  environment:
    name: 'staging'
    url: 'https://staging.meister.com/'
  script:
    - composer install
    - make deploy-staging PATH=/usr/node_modules/.bin:$PATH

deployment-live:
  image: git.sitegeist.de:4567/sitegeist/automata/deployment-php
  tags:
    - docker
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .yarn-cache/
      - .composer/
  when: manual
  stage: deploy
  only:
    - master
  before_script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts'
    - '[[ -f /.dockerenv ]] && echo "$SSH_CONFIG" > ~/.ssh/config'
    - mkdir -p /usr/node_modules
    - npm install --prefix /usr node@12.14.1
    - docker-php-ext-install exif
  environment:
    name: 'master'
    url: 'https://meister.meisterwerke.cloud.net.de/'
  script:
    - composer install
    - make deploy-live PATH=/usr/node_modules/.bin:$PATH

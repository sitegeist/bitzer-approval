'Hoerbiger.HoerbigerCom.Catalog:Content.PaybackCalculatorEVCP':
  superTypes:
    'Hoerbiger.HoerbigerCom:Content': true
    'Hoerbiger.HoerbigerCom:Mixin.Headline': true
  ui:
    icon: 'pencil-square-o'
    label: 'eVCP Calculator'
    inspector:
      groups:
        calculationFactors:
          label: 'Calculation Factors'
          icon: bars
        inputDefaults:
          label: 'Input Defaults'
          icon: keyboard-o

  properties:
    const_unit_btu:
      type: string
      defaultValue: 1.055
      ui:
        label: '1 Btu (kJ)'
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/FloatValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    const_unit_mmbtu:
      type: string
      defaultValue: 1.055
      ui:
        label: '1 MMBtu (million) (GJ)'
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/FloatValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    const_unit_scf:
      type: string
      defaultValue: 0.0283
      ui:
        label: '1 scf, standard cubic feet (Nm3/h)'
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/FloatValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    const_unit_avgHeatingValue4NG:
      type: integer
      defaultValue: 1030
      ui:
        label: 'Average heating value for 1scf natural gas (BTU)'
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    const_composition_dryNaturalGas:
      type: integer
      defaultValue: 80
      ui:
        label: 'Gas composition - Dry natural gas (%)'
        help:
          message: "Gas composition of raw natural gas: (typical)"
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}
        'Neos.Neos/Validation/NumberRangeValidator':
          minimum: 0
          maximum: 100

    const_composition_NGL:
      type: integer
      defaultValue: 10
      ui:
        label: 'Gas composition - NGL (%)'
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}
        'Neos.Neos/Validation/NumberRangeValidator':
          minimum: 0
          maximum: 100

    const_composition_others:
      type: integer
      defaultValue: 10
      ui:
        label: 'Gas composition - Others (%)'
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}
        'Neos.Neos/Validation/NumberRangeValidator':
          minimum: 0
          maximum: 100

    const_cost_actuators:
      type: integer
      defaultValue: 100000
      ui:
        label: 'eVCP actuators per piece ($)'
        help:
          message: "Project costs for end-user for one compressor:"
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    const_cost_localPanel:
      type: integer
      defaultValue: 8000
      ui:
        label: 'Local panel per eVCP ($)'
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    const_cost_installation:
      type: integer
      defaultValue: 33000
      ui:
        label: 'installation ($)'
        help:
          message: "Cabling, labour mechanical and electrical installation"
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    const_cost_scheduleAndControl:
      type: integer
      defaultValue: 8000
      ui:
        label: 'Technical meeting, Schedule and control ($)'
        help:
          message: "Technical clarification meeting , development of control scheme and compressor loading shedule"
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    const_cost_customerIntegration:
      type: integer
      defaultValue: 20000
      ui:
        label: 'Integration into customer control system ($)'
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    const_cost_commission:
      type: integer
      defaultValue: 14000
      ui:
        label: 'Commissioning / start-up services ($)'
        reloadPageIfChanged: true
        inspector:
          group: calculationFactors
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    input_cost_dryNaturalGas:
      type: string
      defaultValue: 2.91
      ui:
        label: 'Price dry natural gas ($ $ per MMBTU)'
        reloadPageIfChanged: true
        inspector:
          group: inputDefaults
      validation:
        'Neos.Neos/Validation/FloatValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    input_cost_NGL:
      type: string
      defaultValue: 6.08
      ui:
        label: 'Price NGL composite ($ $ per MMBTU)'
        reloadPageIfChanged: true
        inspector:
          group: inputDefaults
      validation:
        'Neos.Neos/Validation/FloatValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    input_compressor_annualOperationHours:
      type: integer
      defaultValue: 8000
      ui:
        label: 'Annual operating hours (hours)'
        reloadPageIfChanged: true
        inspector:
          group: inputDefaults
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    input_compressor_cylindersNumber:
      type: integer
      defaultValue: 2
      ui:
        label: 'Number of 1st stage cylinders (pcs)'
        reloadPageIfChanged: true
        inspector:
          group: inputDefaults
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    input_compressor_nominalFlowRate:
      type: integer
      defaultValue: 7
      ui:
        label: 'Compressor nominal flow rate without eVCP (MMSCFD)'
        reloadPageIfChanged: true
        inspector:
          group: inputDefaults
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

    input_compressor_outputIncrease:
      type: integer
      defaultValue: 7
      ui:
        label: 'Increase of output thanks to eVCP'
        reloadPageIfChanged: true
        inspector:
          group: inputDefaults
      validation:
        'Neos.Neos/Validation/IntegerValidator': {}
        'Neos.Neos/Validation/NotEmptyValidator': {}

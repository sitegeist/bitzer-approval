#
# hoerbiger.com GitLab CI configuration
#

stages:
  - 'housekeeping'
  - 'testing'
  - 'deploy'

variables:
  DEPLOYMENT_IMAGE: $CI_REGISTRY/sitegeist/automata/deployment-php

services:
  - name: git.sitegeist.de:4567/sitegeist/shadowsocks:latest
    alias: shadowsocks

.automata:
  image: $DEPLOYMENT_IMAGE:8.2
  tags:
    - docker
  stage: deploy
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .yarn_cache
      - .composer_cache
  before_script:
    # Specify path to composer and yarn caches
    - export COMPOSER_CACHE_DIR=$CI_PROJECT_DIR/.composer_cache
    - export YARN_CACHE_FOLDER=$CI_PROJECT_DIR/.yarn_cache
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo "$SSH_CONFIG" > ~/.ssh/config'
    - '[[ -f /.dockerenv ]] && echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts'
    # Enforce Node 16
    - 'npm install --global --force node@16'
  script:
    - 'composer2 install'
    - 'composer2 lint'
    - 'composer2 test'
#
# Automatically create merge requests for feature branches to develop, staging and main
#
housekeeping-merge-requests:
  image: $CI_REGISTRY/sitegeist/mr:latest
  tags:
    - docker
  only:
    - /^\d+(-.*)/
  stage: housekeeping
  script:
    |
    # extract parts from branch name
    mrTicketNumber=`echo $CI_COMMIT_REF_NAME | cut -d "#" -f2 | cut -d "/" -f1`

    # create merge requests for develop, staging and main
    mr -p "$CI_PROJECT_ID" -s "$CI_COMMIT_REF_NAME" -d develop --token "$BUILD_TOKEN" --title "$mrTicketNumber" --labels Develop
    mr -p "$CI_PROJECT_ID" -s "$CI_COMMIT_REF_NAME" -d staging --token "$BUILD_TOKEN" --title "$mrTicketNumber" --labels Staging
    mr -p "$CI_PROJECT_ID" -s "$CI_COMMIT_REF_NAME" -d main --token "$BUILD_TOKEN" --title "$mrTicketNumber" --labels Main

deployment-develop:
  extends: .automata
  only:
    - develop
  environment:
    name: develop
    url: https://www-dev.hoerbiger.com
  script:
    - 'composer2 deploy:develop'

deployment-staging:
  extends: .automata
  only:
    - staging
  environment:
    name: staging
    url: https://www-stage.hoerbiger.com
  script:
    - 'composer2 deploy:staging'

deployment-main:
  extends: .automata
  when: manual
  only:
    - main
  environment:
    name: main
    url: https://www.hoerbiger.com
  script:
    - 'composer2 deploy:main'
